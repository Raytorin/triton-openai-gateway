version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - runtime
    groups:
      gateway-web-stack:
        patterns:
          - fastapi
          - pydantic
          - starlette
          - uvicorn
    ignore:
      # This version is coupled to the vLLM build in the NVIDIA base image.
      - dependency-name: compressed-tensors
      # Triton client 2.70 requires protobuf >=6.30,<7.0.
      - dependency-name: protobuf
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - runtime

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns:
          - "*"
