name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Audit Python dependencies
        run: |
          pip-audit --requirement requirements-test.txt --progress-spinner off
          pip-audit \
            --requirement docker/triton-chat-gateway-requirements.txt \
            --progress-spinner off

      - name: Run unit tests with coverage
        run: >-
          python -m pytest -q
          --cov=gateway
          --cov=backends/vllm_multimodal
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=50

      - name: Run media preprocessing smoke test
        run: python tests/runtime_media_smoke.py

      - name: Validate citation metadata
        run: cffconvert --validate

      - name: Validate shell syntax
        run: >-
          bash -n
          watch_triton.sh
          docker/80-watch-triton.sh
          docker/90-triton-chat-gateway.sh

  helm:
    name: Helm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.21.0

      - name: Lint charts
        run: |
          helm lint ./helm/triton-gateway
          helm lint ./helm/dcgm-exporter

      - name: Render default and production manifests
        run: |
          helm template test ./helm/triton-gateway >/dev/null
          helm template test ./helm/triton-gateway \
            --values helm/triton-gateway/values.production.example.yaml \
            >/dev/null
